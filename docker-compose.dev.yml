# ==========================================
# MedCare Local Development Docker Compose
# ==========================================
# Usage:
#   1. Run Database & Redis only (Host-based development):
#      docker compose -f docker-compose.dev.yml up -d
#
#   2. Run Full Dev Stack with Hot-Reloading in Docker:
#      docker compose -f docker-compose.dev.yml --profile full up -d --build
# ==========================================

services:
  # ==========================================
  # 1. PostgreSQL Multi-Database Engine
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: medcare-postgres-dev
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcare_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medcare_db}
      POSTGRES_MULTIPLE_DATABASES: "auth_db,doctor_db,patient_db,appointment_db,clinic_db,billing_db,notification_db,audit_db,chat_db,medcare_db"
    volumes:
      - medcare_dev_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcare} -d ${POSTGRES_DB:-medcare_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - medcare-dev-net

  # ==========================================
  # 2. Redis Cache & Microservices Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: medcare-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - medcare_dev_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - medcare-dev-net

  # ==========================================
  # 3. pgAdmin Web GUI (http://localhost:5050)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medcare-pgadmin-dev
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@medcare.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secure_password_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medcare-dev-net

  # ==========================================
  # 4. Mailpit Local Email Tester (http://localhost:8025)
  # ==========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: medcare-mailpit-dev
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Server
    networks:
      - medcare-dev-net

  # ==========================================
  # 5. API Gateway (Dev Mode with Live Reload)
  # ==========================================
  api-gateway:
    profiles: ["full", "gateway"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: medcare-gateway-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=GRPC
      - GRPC_AUTH_SERVICE_URL=auth-service:3015
      - GRPC_DOCTOR_SERVICE_URL=doctor-service:3002
      - GRPC_PATIENT_SERVICE_URL=patient-service:3003
      - GRPC_APPOINTMENT_SERVICE_URL=appointment-service:3004
      - GRPC_CLINIC_SERVICE_URL=clinic-service:3005
      - GRPC_BILLING_SERVICE_URL=billing-service:3006
      - GRPC_NOTIFICATION_SERVICE_URL=notification-service:3007
      - GRPC_AUDIT_SERVICE_URL=audit-service:3008
      - GRPC_ANALYTICS_SERVICE_URL=analytics-service:3010
      - GRPC_CHAT_SERVICE_URL=chat-service:3014
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:gateway:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medcare-dev-net

  # ==========================================
  # 6. Auth Service (Dev Mode)
  # ==========================================
  auth-service:
    profiles: ["full", "services"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microservice
      args:
        APP_NAME: auth-service
    container_name: medcare-auth-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@postgres:5432/auth_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=GRPC
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:auth:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medcare-dev-net

