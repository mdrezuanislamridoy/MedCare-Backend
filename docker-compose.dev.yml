services:
  # ==========================================
  # PostgreSQL Database (Local Dev)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: medcare-postgres-dev
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcare_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medcare_db}
    volumes:
      - medcare_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcare} -d ${POSTGRES_DB:-medcare_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ==========================================
  # Redis Cache & PubSub (Local Dev)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: medcare-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - medcare_dev_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ==========================================
  # pgAdmin Database GUI (http://localhost:5050)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medcare-pgadmin-dev
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@medcare.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  medcare_dev_pgdata:
    name: medcare_dev_pgdata
  medcare_dev_redisdata:
    name: medcare_dev_redisdata
