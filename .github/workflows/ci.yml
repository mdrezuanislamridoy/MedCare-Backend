name: Distributed Microservices CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/medcare_test?schema=public"
  DATABASE_URL_AUTH: "postgresql://postgres:postgres@localhost:5432/auth_test?schema=public"
  DATABASE_URL_DOCTOR: "postgresql://postgres:postgres@localhost:5432/doctor_test?schema=public"
  DATABASE_URL_PATIENT: "postgresql://postgres:postgres@localhost:5432/patient_test?schema=public"
  DATABASE_URL_APPOINTMENT: "postgresql://postgres:postgres@localhost:5432/appointment_test?schema=public"
  DATABASE_URL_CLINIC: "postgresql://postgres:postgres@localhost:5432/clinic_test?schema=public"
  DATABASE_URL_BILLING: "postgresql://postgres:postgres@localhost:5432/billing_test?schema=public"
  DATABASE_URL_NOTIFICATION: "postgresql://postgres:postgres@localhost:5432/notification_test?schema=public"
  DATABASE_URL_AUDIT: "postgresql://postgres:postgres@localhost:5432/audit_test?schema=public"
  DATABASE_URL_CHAT: "postgresql://postgres:postgres@localhost:5432/chat_test?schema=public"
  REDIS_URL: "redis://localhost:6379"
  JWT_SECRET: "ci_pipeline_super_secret_jwt_key_2026"

jobs:
  # =============================================================
  # Job 1: Global Code Quality & Linting
  # =============================================================
  lint-and-quality:
    name: 🔍 ESLint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔄 Generate Prisma 7 Clients
        run: npm run prisma:generate:all

      - name: 🔍 Run ESLint
        run: npm run lint

  # =============================================================
  # Job 2: Distributed Per-Service Test & Build Matrix
  # =============================================================
  microservices-ci:
    name: ⚡ CI • ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "API Gateway"
            project: "api-gateway"
            path: "apps/api-gateway"

          - name: "Auth Service"
            project: "auth-service"
            path: "apps/auth-service"

          - name: "Doctor Service"
            project: "doctor-service"
            path: "apps/doctor-service"

          - name: "Patient Service"
            project: "patient-service"
            path: "apps/patient-service"

          - name: "Appointment Service"
            project: "appointment-service"
            path: "apps/appointment-service"

          - name: "Clinic Service"
            project: "clinic-service"
            path: "apps/clinic-service"

          - name: "Billing Service"
            project: "billing-service"
            path: "apps/billing-service"

          - name: "Notification Service"
            project: "notification-service"
            path: "apps/notification-service"

          - name: "Audit Service"
            project: "audit-service"
            path: "apps/audit-service"

          - name: "Chat Service"
            project: "chat-service"
            path: "apps/chat-service"

          - name: "Analytics Service"
            project: "analytics-service"
            path: "apps/analytics-service"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔄 Generate Prisma 7 Clients
        run: npm run prisma:generate:all

      - name: 🧪 Run Unit Tests for ${{ matrix.service.name }}
        run: npx jest --passWithNoTests ${{ matrix.service.path }}

      - name: 🏗️ Build ${{ matrix.service.name }}
        run: npx nest build ${{ matrix.service.project }}
