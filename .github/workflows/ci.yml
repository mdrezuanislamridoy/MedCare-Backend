name: MedCare Microservices CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # Job 1: Lint, Test & Monorepo Build
  # =============================================================
  lint-test-and-build:
    name: Code Quality, Unit Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medcare
          POSTGRES_PASSWORD: medcare_secure_pass
          POSTGRES_DB: medcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://medcare:medcare_secure_pass@localhost:5432/medcare_db?schema=public"
      DATABASE_URL_AUTH: "postgresql://medcare:medcare_secure_pass@localhost:5432/auth_db?schema=public"
      DATABASE_URL_DOCTOR: "postgresql://medcare:medcare_secure_pass@localhost:5432/doctor_db?schema=public"
      DATABASE_URL_PATIENT: "postgresql://medcare:medcare_secure_pass@localhost:5432/patient_db?schema=public"
      DATABASE_URL_APPOINTMENT: "postgresql://medcare:medcare_secure_pass@localhost:5432/appointment_db?schema=public"
      DATABASE_URL_CLINIC: "postgresql://medcare:medcare_secure_pass@localhost:5432/clinic_db?schema=public"
      DATABASE_URL_BILLING: "postgresql://medcare:medcare_secure_pass@localhost:5432/billing_db?schema=public"
      DATABASE_URL_NOTIFICATION: "postgresql://medcare:medcare_secure_pass@localhost:5432/notification_db?schema=public"
      DATABASE_URL_AUDIT: "postgresql://medcare:medcare_secure_pass@localhost:5432/audit_db?schema=public"
      DATABASE_URL_CHAT: "postgresql://medcare:medcare_secure_pass@localhost:5432/chat_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci_pipeline_super_secret_jwt_key_2026"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔄 Generate Prisma 7 Clients
        run: npm run prisma:generate:all

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm run test -- --passWithNoTests

      - name: 🏗️ Build All Microservices
        run: npm run build

  # =============================================================
  # Job 2: Docker Image Build Validation
  # =============================================================
  docker-build-check:
    name: Dockerfile Verification
    runs-on: ubuntu-latest
    needs: lint-test-and-build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.gateway
          push: false
          tags: medcare-api-gateway:ci-test

      - name: 🛠️ Build Doctor Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.microservice
          build-args: APP_NAME=doctor-service
          push: false
          tags: medcare-doctor-service:ci-test
