# ==============================================================================
# MedCare Backend — 100% Free Render Blueprint (No Credit Card Required)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ============================================================================
  # MedCare All-In-One Web Service (API Gateway + Embedded Microservices & Redis)
  # Runs the public API Gateway and background microservices within 1 Free Web Service.
  # ============================================================================
  - type: web
    name: medcare-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MICROSERVICE_TRANSPORT
        value: GRPC
      - key: REDIS_HOST
        value: 127.0.0.1
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: medcare-postgres
          property: connectionString
      - key: GRPC_AUTH_SERVICE_URL
        value: 127.0.0.1:3015
      - key: GRPC_DOCTOR_SERVICE_URL
        value: 127.0.0.1:3002
      - key: GRPC_PATIENT_SERVICE_URL
        value: 127.0.0.1:3003
      - key: GRPC_APPOINTMENT_SERVICE_URL
        value: 127.0.0.1:3004
      - key: GRPC_CLINIC_SERVICE_URL
        value: 127.0.0.1:3005
      - key: GRPC_BILLING_SERVICE_URL
        value: 127.0.0.1:3006
      - key: GRPC_NOTIFICATION_SERVICE_URL
        value: 127.0.0.1:3007
      - key: GRPC_AUDIT_SERVICE_URL
        value: 127.0.0.1:3008
      - key: GRPC_CHAT_SERVICE_URL
        value: 127.0.0.1:3014
      - key: GRPC_ANALYTICS_SERVICE_URL
        value: 127.0.0.1:3010

# ==============================================================================
# Managed PostgreSQL Database (Free Tier)
# ==============================================================================
databases:
  - name: medcare-postgres
    databaseName: medcare_db
    user: medcare
    plan: free
    region: oregon
