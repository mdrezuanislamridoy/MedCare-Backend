  # ==========================================
  # 11. ANALYTICS MICROSERVICE
  # ==========================================
  medcare-analytics-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microservice
      args:
        APP_NAME: analytics-service
    container_name: medcare-analytics-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=REDIS
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
    depends_on:
      medcare-postgres:
        condition: service_healthy
      medcare-redis:
        condition: service_healthy
    networks:
      - medcare-net

  # ==========================================
  # POSTGRESQL MULTI-DATABASE ENGINE
  # ==========================================
  medcare-postgres:
    image: postgres:16-alpine
    container_name: medcare-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcare_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medcare_db}
      POSTGRES_MULTIPLE_DATABASES: "auth_db,doctor_db,patient_db,appointment_db,clinic_db,billing_db,notification_db,audit_db,chat_db,medcare_db"
    volumes:
      - medcare_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcare} -d ${POSTGRES_DB:-medcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - medcare-net

  # ==========================================
  # REDIS (EVENT BROKER & DISTRIBUTED TRANSPORT)
  # ==========================================
  medcare-redis:
    image: redis:7-alpine
    container_name: medcare-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - medcare_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - medcare-net

  # ==========================================
  # PGADMIN (DATABASE GUI)
  # ==========================================
  medcare-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medcare-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@medcare.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secure_password_2026}
    depends_on:
      medcare-postgres:
        condition: service_healthy
    networks:
      - medcare-net

# ==========================================
# PERSISTENT VOLUMES & NETWORKS
# ==========================================
volumes:
  medcare_pgdata:
    name: medcare_pgdata
  medcare_redisdata:
    name: medcare_redisdata
  medcare_uploads:
    name: medcare_uploads

networks:
  medcare-net:
    name: medcare-network
    driver: bridge
