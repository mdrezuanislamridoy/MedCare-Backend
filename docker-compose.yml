      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@medcare-postgres:5432/medcare_chat?schema=public
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
