      context: .
      dockerfile: infrastructure/docker/Dockerfile.microservice
      args:
        APP_NAME: chat-service
    container_name: medcare-chat-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@medcare-postgres:5432/chat_db?schema=public
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=REDIS
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
