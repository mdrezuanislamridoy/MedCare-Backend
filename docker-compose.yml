services:
  # ==========================================
  # 0. NGINX (Edge Reverse Proxy & Ingress)
  # ==========================================
  medcare-nginx:
    image: nginx:1.27-alpine
    container_name: medcare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - medcare-api-gateway
    networks:
      - medcare-net

  # ==========================================
  # 1. API GATEWAY (Central REST Gateway)
  # ==========================================
  medcare-api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: medcare-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://medcare-redis:6379
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=REDIS
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
    volumes:
      - medcare_uploads:/app/uploads
    depends_on:
      medcare-postgres:
        condition: service_healthy
      medcare-redis:
        condition: service_healthy
    networks:
      - medcare-net

  # ==========================================
  # 2. AUTH MICROSERVICE
  # ==========================================
  medcare-auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microservice
      args:
        APP_NAME: auth-service
    container_name: medcare-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@medcare-postgres:5432/auth_db?schema=public
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=REDIS
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
    depends_on:
      medcare-postgres:
        condition: service_healthy
      medcare-redis:
        condition: service_healthy
    networks:
      - medcare-net

  # ==========================================
  # 3. DOCTOR MICROSERVICE
