      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@medcare-postgres:5432/audit_db?schema=public
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
