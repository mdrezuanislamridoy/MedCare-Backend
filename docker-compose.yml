      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medcare}:${POSTGRES_PASSWORD:-medcare_secure_pass}@medcare-postgres:5432/medcare_analytics?schema=public
      - REDIS_HOST=medcare-redis
      - REDIS_PORT=6379
      - MICROSERVICE_TRANSPORT=REDIS
      - JWT_SECRET=${JWT_SECRET:-medcare_enterprise_super_secret_jwt_key_2026}
    depends_on:
      medcare-postgres:
        condition: service_healthy
      medcare-redis:
        condition: service_healthy
    networks:
      - medcare-net

  # ==========================================
  # POSTGRESQL MULTI-DATABASE ENGINE
  # ==========================================
  medcare-postgres:
    image: postgres:16-alpine
    container_name: medcare-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcare_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medcare_core}
      POSTGRES_MULTIPLE_DATABASES: "medcare_core,medcare_doctor,medcare_patient,medcare_appointment,medcare_clinic,medcare_finance,medcare_audit,medcare_chat,medcare_notification,medcare_support,medcare_analytics,medcare_review,medcare_system"
    volumes:
      - medcare_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcare} -d ${POSTGRES_DB:-medcare_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - medcare-net

  # ==========================================
  # REDIS (EVENT BROKER & DISTRIBUTED TRANSPORT)
  # ==========================================
  medcare-redis:
    image: redis:7-alpine
    container_name: medcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - medcare_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - medcare-net

  # ==========================================
  # PGADMIN (DATABASE GUI)
  # ==========================================
  medcare-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medcare-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@medcare.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      medcare-postgres:
        condition: service_healthy
    networks:
      - medcare-net

# ==========================================
# PERSISTENT VOLUMES & NETWORKS
# ==========================================
volumes:
  medcare_pgdata:
    name: medcare_pgdata
  medcare_redisdata:
    name: medcare_redisdata
  medcare_uploads:
    name: medcare_uploads
  medcare_caddy_data:
    name: medcare_caddy_data
  medcare_caddy_config:
    name: medcare_caddy_config

networks:
  medcare-net:
    name: medcare-network
    driver: bridge
